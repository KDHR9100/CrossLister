[project]
name = "crosslister"
version = "0.1.0"
description = "Open-source, self-hosted multimodal agent for cross-border e-commerce listing generation"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "openai>=1.30",
    "langgraph>=0.2,<0.5",
    "chromadb>=0.5.0,<0.7",
    "sentence-transformers>=2.7",
    # chromadb 0.6.x calls the old posthog capture(distinct_id, event, props)
    # signature; posthog >= 6.0 changed it and spams "capture() takes 1
    # positional argument" errors. Pin to the pre-6.0 API.
    "posthog>=2.4.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
