services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      # ChromaDB runs embedded inside the API process and persists here.
      - ./data:/app/data

  # Self-hosted models (reserved). Require NVIDIA GPU + nvidia-container-toolkit.
